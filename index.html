            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

                    { q: "'Çok çalıştı' cümlesinde 'çok' ne tür zarftır?", options: ["Miktar (Azlık-Çokluk) zarfı", "Durum zarfı", "Zaman zarfı", "Yer-yön zarfı"], answer: 0 },
                    { q: "Yer-yön zarfları ek aldığında (örn: aşağıya) ne olur?", options: ["İsimleşir (Zarf olmaktan çıkar)", "Yine zarf kalır", "Sıfat olur", "Zamir olur"], answer: 0 },
                    { q: "Yazımı doğru olan sözcük hangisidir?", options: ["Rastgele", "Traş", "Yalnış", "Yalnızca"], answer: 0 }
                ]
            },
            "Sosyal": {
                "1. Ünite: Birey ve Toplum": [
                    { q: "İletişimde kişiyi suçlamayan, kendi duygusunu belirten dile ne denir?", options: ["Ben Dili", "Sen Dili", "Kaba Dil", "Resmi Dil"], answer: 0 },
                    { q: "Empati nedir?", options: ["Kendini başkasının yerine koymak", "Sempatik olmak", "Bencillik etmek", "Suskun kalmak"], answer: 0 },
                    { q: "Etkili dinleyicinin yapması gereken davranış hangisidir?", options: ["Göz teması kurmak ve dinlemek", "Söz kesmek", "Telefonla oynamak", "Arkayı dönmek"], answer: 0 },
                    { q: "Medya okuryazarlığı nedir?", options: ["Medya iletilerini doğru değerlendirme becerisi", "Televizyon izlemek", "Gazete satmak", "Sosyal medyada paylaşım yapmak"], answer: 0 },
                    { q: "Anayasamızın 20. maddesiyle güvenceye alınan hak hangisidir?", options: ["Özel hayatın gizliliği", "Yerleşme hürriyeti", "Seyahat hürriyeti", "Eğitim hakkı"], answer: 0 }
                ],
                "2. Ünite: Kültür ve Miras (Osmanlı)": [
                    { q: "Osmanlı Devleti'nin kurucusu kimdir?", options: ["Osman Bey", "Orhan Bey", "Ertuğrul Gazi", "Fatih Sultan"], answer: 0 },
                    { q: "İstanbul'u fethederek Çağ kapatıp Çağ açan Osmanlı padişahı kimdir?", options: ["Fatih Sultan Mehmet", "Kanuni", "Yavuz", "2. Abdülhamid"], answer: 0 },
                    { q: "Osmanlı'nın fethettiği yerlerde izlediği hoşgörü politikasına ne denir?", options: ["İstimalet Politikası", "İskan Politikası", "Devşirme", "Tımar"], answer: 0 },
                    { q: "Fethedilen yerlere Türkmenlerin yerleştirilmesi politikasına ne denir?", options: ["İskan Politikası", "İstimalet", "Gaza", "Cihat"], answer: 0 },
                    { q: "Osmanlı'da eyalet askerlerinin yetiştirildiği toprak sistemine ne denir?", options: ["Tımar Sistemi", "Devşirme", "Enderun", "Lonca"], answer: 0 }
                ],
                "3. Ünite: İnsanlar, Yerler ve Çevre": [
                    { q: "Bir km²'ye düşen insan sayısına ne denir?", options: ["Nüfus yoğunluğu", "Nüfus artış hızı", "Doğal nüfus", "Göç oranı"], answer: 0 },
                    { q: "Türkiye'de nüfusun en yoğun olduğu bölge hangisidir?", options: ["Marmara Bölgesi", "İç Anadolu", "Doğu Anadolu", "Karadeniz"], answer: 0 },
                    { q: "Nüfusun dağılışını etkileyen 'beşeri' faktör hangisidir?", options: ["Sanayi ve Ticaret", "İklim", "Yeryüzü şekilleri", "Su kaynakları"], answer: 0 },
                    { q: "Nüfusun dağılışını etkileyen 'doğal' faktör hangisidir?", options: ["İklim ve Yerşekilleri", "Sanayi", "Ulaşım", "Turizm"], answer: 0 },
                    { q: "Beyin göçü ne demektir?", options: ["Eğitimli/Vasıflı insanların yurtdışına gitmesi", "Köyden kente göç", "Mevsimlik göç", "Mübadele"], answer: 0 }
                ],
                "4. Ünite: Bilim, Teknoloji ve Toplum": [
                    { q: "Tarihte bilinen ilk yazıyı kimler bulmuştur?", options: ["Sümerler (Çivi Yazısı)", "Mısırlılar", "Fenikeliler", "Yunanlar"], answer: 0 },
                    { q: "Günümüz alfabesinin temelini atan uygarlık hangisidir?", options: ["Fenikeliler", "Sümerler", "Mısırlılar", "Babiller"], answer: 0 },
                    { q: "Matbaayı geliştirerek kitapların ucuza basılmasını sağlayan kimdir?", options: ["Gutenberg", "Galileo", "Newton", "Copernicus"], answer: 0 },
                    { q: "Dünyanın yuvarlak olduğunu bilimsel olarak ispatlayan denizci kimdir?", options: ["Magellan / Del Cano", "Kristof Kolomb", "Vasco da Gama", "Marco Polo"], answer: 0 },
                    { q: "Cebir biliminin kurucusu olan Müslüman matematikçi kimdir?", options: ["Harezmi", "İbni Sina", "Biruni", "Farabi"], answer: 0 }
                ],
                "5. Ünite: Üretim, Dağıtım ve Tüketim": [
                    { q: "Toprağın işlenmesi ve ürün elde edilmesine ne denir?", options: ["Tarım", "Sanayi", "Hizmet sektörü", "Madencilik"], answer: 0 },
                    { q: "Osmanlı'daki esnaf dayanışma teşkilatına ne denir?", options: ["Ahilik Teşkilatı / Lonca", "Tımar", "Enderun", "Divan"], answer: 0 },
                    { q: "Mesleki eğitim veren Osmanlı okuluna ne ad verilir?", options: ["Enderun / Medrese", "Tımar", "Lonca", "Sıbyan mektebi"], answer: 0 },
                    { q: "Sanayi İnkılabı ilk olarak hangi ülkede başlamıştır?", options: ["İngiltere", "Fransa", "Almanya", "ABD"], answer: 0 },
                    { q: "Sanayi İnkılabı ile insan ve hayvan gücünün yerini ne almıştır?", options: ["Buhar gücü ve makineler", "Rüzgar gücü", "Güneş enerjisi", "Elektrik"], answer: 0 }
                ]
            }
        };

        let currentSubject = "";
        let currentTopic = "";
        let currentQuestions = [];
        let qIndex = 0;
        let score = 0;
        let timer = null;
        let timeLeft = 15;

        function showScreen(screenId) {
            document.getElementById('subjectScreen').style.display = 'none';
            document.getElementById('topicScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById(screenId).style.display = 'block';
            if(screenId === 'subjectScreen') updateLeaderboardUI();
        }

        function selectSubject(sub) {
            currentSubject = sub;
            document.getElementById('topicScreenTitle').innerText = sub + " Tüm Yıl Üniteleri";
            let list = document.getElementById('topicList');
            list.innerHTML = "";

            let topics = Object.keys(db[sub] || {});
            topics.forEach(t => {
                let btn = document.createElement('button');
                btn.className = 'topic-btn';
                btn.innerHTML = `<span>${t}</span> <i class="fa-solid fa-play" style="color:var(--accent-blue)"></i>`;
                btn.onclick = () => startQuiz(t);
                list.appendChild(btn);
            });

            showScreen('topicScreen');
        }

        function startQuiz(topic) {
            currentTopic = topic;
            currentQuestions = db[currentSubject][topic];
            qIndex = 0;
            score = 0;
            document.getElementById('timerBg').style.display = 'block';
            showScreen('quizScreen');
            loadQuestion();
        }

        function loadQuestion() {
            if(qIndex >= currentQuestions.length) {
                finishQuiz();
                return;
            }

            let item = currentQuestions[qIndex];
            document.getElementById('questionTitle').innerText = `${qIndex + 1}. ${item.q}`;
            let grid = document.getElementById('optionsGrid');
            grid.innerHTML = "";

            item.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
                btn.onclick = () => checkAnswer(idx, btn);
                grid.appendChild(btn);
            });

            resetTimer();
            updateStats();
        }

        function resetTimer() {
            clearInterval(timer);
            timeLeft = 15;
            document.getElementById('timerText').innerText = timeLeft;
            document.getElementById('timerBar').style.width = '100%';

            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timerText').innerText = timeLeft;
                document.getElementById('timerBar').style.width = (timeLeft / 15 * 100) + '%';

                if(timeLeft <= 0) {
                    clearInterval(timer);
                    playSound(150, 'sawtooth', 0.4);
                    checkAnswer(-1, null);
                }
            }, 1000);
        }

        function checkAnswer(selectedIdx, btnElement) {
            clearInterval(timer);
            let item = currentQuestions[qIndex];
            let allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if(selectedIdx === item.answer) {
                if(btnElement) btnElement.classList.add('correct');
                score += 10 + timeLeft;
                playSound(600, 'sine', 0.2);
            } else {
                if(btnElement) btnElement.classList.add('wrong');
                allBtns[item.answer].classList.add('correct');
                playSound(180, 'square', 0.3);
            }

            updateStats();

            setTimeout(() => {
                qIndex++;
                loadQuestion();
            }, 1400);
        }

        function finishQuiz() {
            clearInterval(timer);
            document.getElementById('timerBg').style.display = 'none';
            let name = prompt(`Tebrikler! ${currentTopic} bitti.\nToplam Skorun: ${score}\nAdını Liderlik Tahtasına Yaz:`);
            if(name) {
                saveScore(name, score);
            }
            showScreen('subjectScreen');
        }

        function quitQuiz() {
            clearInterval(timer);
            document.getElementById('timerBg').style.display = 'none';
            showScreen('topicScreen');
        }

        function updateStats() {
            document.getElementById('scoreText').innerText = score;
            document.getElementById('qCountText').innerText = `${qIndex + 1}/${currentQuestions ? currentQuestions.length : 0}`;
        }

        function saveScore(name, score) {
            let leaderboard = JSON.parse(localStorage.getItem('7b_scores_full') || '[]');
            leaderboard.push({ name, score, subject: currentSubject });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 5);
            localStorage.setItem('7b_scores_full', JSON.stringify(leaderboard));
            updateLeaderboardUI();
        }

        function updateLeaderboardUI() {
            let leaderboard = JSON.parse(localStorage.getItem('7b_scores_full') || '[]');
            let list = document.getElementById('leaderboardList');
            if(leaderboard.length === 0) {
                list.innerHTML = "<div style='font-size:0.8rem; color:#64748b;'>Henüz skor yok. İlk sen ol!</div>";
                return;
            }
            list.innerHTML = leaderboard.map((item, index) => 
                `<div class="leaderboard-item">
                    <span><b>${index + 1}. ${item.name}</b> (${item.subject})</span>
                    <span style="color:var(--accent-gold); font-weight:bold;">${item.score} Puan</span>
                </div>`
            ).join('');
        }

        updateLeaderboardUI();
    </script>
